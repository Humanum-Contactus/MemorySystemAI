[pytest]
# Le dossier racine est lui-même le paquet MemorySystemAI (__init__.py relatif) :
# le mode importlib évite que pytest tente de l’importer.
addopts = --import-mode=importlib -p no:cacheprovider
testpaths = .
# test_voix.py et test_autonomie.py sont des scripts : lancés par pytest_scripts_test.py
python_files = test_contradictions.py pytest_scripts_test.py
